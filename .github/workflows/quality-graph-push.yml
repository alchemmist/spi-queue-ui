# Generated by Quality Graph. DO NOT EDIT MANUALLY. Update qg.yaml and run qg generate.
---
name: Quality Graph (push)
'on':
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: quality-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  graph-freshness:
    name: Quality Graph declaration freshness
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: 'false'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --locked
      - run: uv run qg validate
        name: Run Quality Graph declaration freshness
        id: quality-command
        continue-on-error: true
      - name: Collect Quality Graph declaration freshness result
        id: quality-result
        if: always()
        uses: alchemmist/quality-graph@b947f26e97ccf1c755050dfe38d98cbb688edb69
        with:
          operation: collect
          node-id: graph-freshness
          title: Quality Graph declaration freshness
          adapter: exit-code
          report-path: ''
          command-outcome: ${{ steps.quality-command.outcome }}
          graph-digest: e3502022a107a1e7e1c5b407245c936b27554e38ec667d4436b92fc3b3c47fda
          approval-findings: 'true'
          approval-files: 'false'
          approval-node: 'false'
      - name: Upload Quality Graph declaration freshness result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-result-graph-freshness-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-graph/graph-freshness.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Quality Graph declaration freshness result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.quality-result.outputs.exit-code }}
        run: exit "${EXIT_CODE:-2}"
    timeout-minutes: 5
