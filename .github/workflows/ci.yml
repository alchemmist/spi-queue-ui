name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: HTTP and authorization regressions (local fixtures only)
        run: python3 -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check app/app.js
      - name: Diagnose canonical Harbor TLS routes (anonymous, bounded)
        run: python3 scripts/registry_tls_check.py
      - name: Build standalone image (no registry credentials, no deployment)
        run: docker build --tag spi-queue-ui:test .
  publish:
    concurrency:
      group: spi-queue-ui-release
      cancel-in-progress: false
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLISH_ENABLED == 'true'
    needs: test-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: harbor.socrat.alchemmist.xyz
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Build immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: harbor.socrat.alchemmist.xyz/homelab/spi-queue-ui:${{ github.sha }}
      - name: Record image digest
        run: echo '${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy to Socrat
        uses: alchemmist/deploy-to-socrat@v1
        with:
          app: spi-queue-ui
          token: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          image_version: ${{ steps.image.outputs.digest }}
