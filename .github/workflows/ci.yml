name: SPI service CI and release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Backend and frontend regressions (local fixtures only)
        run: python3 scripts/test_all.py
      - name: JavaScript syntax
        run: node --check frontend/app.js
      - name: Build native test image
        run: docker build --platform linux/amd64 --target test --tag spi-triage:test .
      - name: Offline native and integration regressions in production resource budget
        run: >-
          docker run --rm --network none --read-only --cpus 1
          --memory 384m --memory-swap 384m --pids-limit 256
          --tmpfs /tmp:rw,nosuid,nodev,size=64m
          -e SPI_REQUIRE_NATIVE_TESTS=true spi-triage:test
      - name: Build complete immutable release image (no publication)
        run: docker build --platform linux/amd64 --target release --tag spi-triage:checked .
  publish-and-deploy:
    concurrency:
      group: spi-triage-release
      cancel-in-progress: false
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLISH_ENABLED == 'true'
    needs: test-and-build
    environment: spi-triage-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify scoped Harbor robot and prepare credentials
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: python3 scripts/harbor_ci_auth.py --repository homelab/spi-triage
      - name: Configure isolated Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Per-builder TLS interoperability, not a host/daemon/DNS change.
          # Retain TLS1.3, certificate verification and native robot token auth.
          driver-opts: |
            env.GODEBUG=tlsmlkem=0

      - name: Build and push full-service image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release
          platforms: linux/amd64
          push: true
          tags: harbor.socrat.alchemmist.xyz/homelab/spi-triage:${{ github.sha }}
      - name: Deploy to Socrat
        uses: alchemmist/deploy-to-socrat@v1
        with:
          app: spi-triage
          token: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          image_version: ${{ steps.image.outputs.digest }}

      - name: Remove ephemeral registry credentials
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib
          directory=pathlib.Path(os.environ.get('DOCKER_CONFIG','/nonexistent'))
          if directory.name.startswith('harbor-ci-auth-') and directory.parent==pathlib.Path(os.environ['RUNNER_TEMP']):
              (directory/'config.json').unlink(missing_ok=True)
          PY
