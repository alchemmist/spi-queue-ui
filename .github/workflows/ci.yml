name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: HTTP and authorization regressions (local fixtures only)
        run: python3 -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check app/app.js
      - name: Build standalone image (no registry credentials, no deployment)
        run: docker build --tag spi-queue-ui:test .
