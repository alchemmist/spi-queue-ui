version: 0
provider:
  name: github
  configuration:
    default-branch: main
    runtime:
      action: alchemmist/quality-graph@b947f26e97ccf1c755050dfe38d98cbb688edb69
      upload-artifact-action: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
profiles:
  default:
    runner: ubuntu-24.04
    timeout-minutes: 5
    setup:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: "false"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --locked
nodes:
  graph-freshness:
    title: Quality Graph declaration freshness
    run: uv run qg validate
  workflow-failure-policy:
    title: n8n workflow failure notification policy
    run: uv run python scripts/n8n/check_failure_alerts.py
  workflow-policy-tests:
    title: Offline workflow policy regressions
    run: uv run python -m unittest discover -s tests -p test_n8n_failure_alert_policy.py
  service-tests:
    title: Full SPI service and constrained native image
    needs: [workflow-failure-policy, workflow-policy-tests]
    timeout-minutes: 20
    run: |
      uv run python scripts/test_all.py
      node --check frontend/app.js
      docker build --platform linux/amd64 --target test --tag spi-triage:test .
      docker run --rm --network none --read-only --cpus 1 --memory 384m --memory-swap 384m --pids-limit 256 --tmpfs /tmp:rw,nosuid,nodev,size=64m -e SPI_REQUIRE_NATIVE_TESTS=true spi-triage:test
      docker build --platform linux/amd64 --target release --tag spi-triage:checked .
